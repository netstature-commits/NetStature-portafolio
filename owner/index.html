<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08090b">
<title>Panel privado | NetStature</title>
<link rel="icon" href="../logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090b;--bg2:#0d0f13;--fg:#ece9e2;--mut:#8b909b;--line:rgba(236,233,226,.16);--gold:#c4a66c;--gold2:#e2cb98;--navy:#18314d;--navy2:#102238;--gray:#888d93;
--disp:'Archivo',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--disp);font-weight:500;line-height:1.55;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--gold);color:#000}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono);font-weight:400;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
h1,h2,h3{font-weight:900;font-stretch:112%;text-transform:uppercase;letter-spacing:-.02em;line-height:.95}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.8rem 1.3rem;font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--fg);transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s,color .2s}
.btn-gold{background:var(--gold);color:#0a0a0a;border-color:var(--gold);box-shadow:5px 5px 0 var(--fg)}
.btn-gold:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--fg)}
.btn-line:hover{background:var(--fg);color:#0a0a0a}
.btn.sm{padding:.55rem .85rem;font-size:.68rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tile{width:38px;height:38px;background:var(--gray);display:grid;place-items:center;flex:none}
.tile svg{width:21px;height:32px}

/* acceso */
#gate{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:linear-gradient(to right,rgba(236,233,226,.05) 1px,transparent 1px) 0 0/calc(100%/12) 100%,var(--bg)}
.gate-card{width:min(100%,520px);border:2px solid var(--fg);background:var(--bg);padding:clamp(1.4rem,4vw,2.4rem);box-shadow:10px 10px 0 var(--navy)}
.gate-card h1{font-size:clamp(2rem,6vw,3rem);margin:1.2rem 0 1rem}
.gate-card p{color:#b6bac4;margin-bottom:1.4rem}
.gate-card ol{margin:0 0 1.4rem 1.2rem;color:#b6bac4;font-size:.95rem}
.gate-card li{margin-bottom:.5rem}
.gate-card code{font-family:var(--mono);font-size:.82em;background:var(--navy2);padding:.1em .4em}
.gate-act{display:flex;gap:1rem;flex-wrap:wrap}
.msg-err{font-family:var(--mono);font-size:.78rem;color:var(--gold2);margin-top:1rem;min-height:1.2em}

/* app */
.top{position:sticky;top:0;z-index:50;background:rgba(8,9,11,.96);border-bottom:2px solid var(--fg)}
.top-in{max-width:1280px;margin:auto;padding:.7rem 1.1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7rem;margin-right:auto}
.brand strong{font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:.95rem;letter-spacing:-.02em}
.brand span{display:block}
.tabs{display:flex;gap:.4rem}
.tabs button{padding:.6rem 1rem;font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;border:2px solid var(--line);transition:.2s}
.tabs button.on{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.tabs button:not(.on):hover{border-color:var(--fg)}
.tabs .badge{display:inline-block;min-width:1.4em;margin-left:.4rem;padding:0 .35em;background:var(--fg);color:#0a0a0a;font-size:.68rem;text-align:center}
.who{display:flex;align-items:center;gap:.8rem}
.who .mono{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:1280px;margin:auto;padding:1.4rem 1.1rem 5rem}
.bar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.4rem}
.bar .sp{margin-left:auto}
.chip{padding:.5rem .9rem;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;border:2px solid var(--line);transition:.2s}
.chip.on{background:var(--fg);color:#0a0a0a;border-color:var(--fg)}
.chip:not(.on):hover{border-color:var(--fg)}
.sample{display:inline-block;padding:.35rem .7rem;background:var(--gold);color:#0a0a0a;font-family:var(--mono);font-size:.68rem;text-transform:uppercase}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.9rem;margin-bottom:1.1rem}
.kpi{border:2px solid var(--fg);padding:1.1rem 1rem;background:var(--bg2)}
.kpi b{display:block;font-weight:900;font-stretch:125%;font-size:clamp(1.8rem,3.4vw,2.8rem);letter-spacing:-.04em;line-height:1;color:var(--gold);margin:.5rem 0 .3rem}
.kpi small{color:var(--mut);font-size:.8rem;line-height:1.3;display:block}
.card{border:2px solid var(--fg);background:var(--bg2);padding:1.2rem}
.card h3{font-size:1.05rem;margin-bottom:1rem}
.card .mono{display:block;margin-bottom:.4rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem;margin-top:.9rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem;margin-top:.9rem}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{font-family:var(--mono);font-size:10px;fill:var(--mut)}
.chart rect.b{fill:var(--gold);transition:fill .15s}
.chart rect.b:hover{fill:var(--gold2)}
.chart rect.l{fill:var(--fg)}
.leg{display:flex;gap:1rem;margin-top:.8rem}
.leg i{display:inline-block;width:10px;height:10px;margin-right:.4rem;background:var(--gold)}
.leg i.w{background:var(--fg)}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .8rem;margin-bottom:.8rem;font-size:.92rem}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb span:nth-child(2){font-family:var(--mono);color:var(--gold);font-size:.82rem}
.hb .tr{grid-column:1/-1;height:6px;background:var(--line)}
.hb .tr i{display:block;height:100%;background:var(--gold)}
.empty{color:var(--mut);font-size:.9rem;padding:.4rem 0}
.recent{width:100%;border-collapse:collapse;font-size:.9rem}
.recent td{padding:.55rem .4rem;border-bottom:1px solid var(--line)}
.recent td:first-child{font-family:var(--mono);font-size:.76rem;color:var(--mut);white-space:nowrap}
.recent td{word-break:break-word}
#recent{overflow-x:auto}
.card{min-width:0}

/* contactos */
.leads{display:grid;gap:.8rem}
.lead{border:2px solid var(--fg);background:var(--bg2)}
.lead>button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1rem;align-items:center;padding:1rem;text-align:left}
.pill{display:inline-block;padding:.25rem .6rem;border:2px solid var(--fg);font-family:var(--mono);font-size:.66rem;text-transform:uppercase;white-space:nowrap}
.st-Nuevo{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.st-Contactado{border-color:var(--gold);color:var(--gold)}
.st-Cotizado{background:var(--navy);border-color:var(--navy)}
.st-Cerrado{background:var(--fg);color:#0a0a0a}
.st-Descartado{border-color:var(--line);color:var(--mut);text-decoration:line-through}
.lead h4{font-weight:900;font-stretch:112%;text-transform:uppercase;font-size:1.05rem;letter-spacing:-.01em;line-height:1.1}
.lead .sub{color:var(--mut);font-size:.85rem}
.lead .when{font-family:var(--mono);font-size:.7rem;color:var(--mut);text-align:right}
.lead .body{display:none;padding:0 1rem 1.1rem;border-top:1px solid var(--line)}
.lead.open .body{display:block}
.lead .row{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}
.lead .msg{white-space:pre-wrap;color:#d6d9e0;background:var(--bg);border-left:3px solid var(--gold);padding:.8rem 1rem;margin-bottom:1rem}
.lead .ctl{display:grid;grid-template-columns:220px minmax(0,1fr);gap:1rem;align-items:start}
.lead select,.lead textarea{width:100%;padding:.8rem;background:#000;border:2px solid var(--line);color:var(--fg);font:inherit;border-radius:0;color-scheme:dark}
.lead select:focus,.lead textarea:focus{outline:none;border-color:var(--gold)}
.lead textarea{min-height:84px;resize:vertical}
.lead .acts{display:flex;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:1.4rem;translate:-50% 30px;background:var(--gold);color:#000;padding:.8rem 1.3rem;font-family:var(--mono);font-size:.78rem;opacity:0;visibility:hidden;transition:.35s;z-index:100}
.toast.show{opacity:1;visibility:visible;translate:-50% 0}
[hidden]{display:none!important}

@media (max-width:1020px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .tabs{order:3;width:100%}.tabs button{flex:1}
  .who .mono{display:none}
  .lead>button{grid-template-columns:minmax(0,1fr) auto}
  .lead>button .pill{grid-column:1;grid-row:1;justify-self:start}
  .lead>button .mid{grid-column:1/-1;grid-row:2}
  .lead>button .when{grid-column:2;grid-row:1}
  .lead .ctl{grid-template-columns:minmax(0,1fr)}
  .recent td:nth-child(4){display:none}
}
</style>
</head>

<!-- ACCESO -->
<div id="gate">
  <div class="gate-card" id="gateCard"></div>
</div>

<!-- PANEL -->
<div id="app" hidden>
  <header class="top"><div class="top-in">
    <div class="brand"><span class="tile"><svg><use href="#tower"/></svg></span><div><strong>NetStature</strong><span class="mono">Panel privado</span></div></div>
    <nav class="tabs" aria-label="Secciones">
      <button class="on" data-tab="res">Resumen</button>
      <button data-tab="crm">Contactos<span class="badge" id="newBadge">0</span></button>
    </nav>
    <div class="who"><span class="mono" id="who"></span><button class="btn btn-line sm" id="out">Salir</button></div>
  </div></header>

  <div class="wrap">
    <!-- RESUMEN -->
    <section id="tab-res">
      <div class="bar">
        <button class="chip" data-r="7">7 días</button>
        <button class="chip on" data-r="30">30 días</button>
        <button class="chip" data-r="90">90 días</button>
        <span class="sample" id="sampleTag" hidden>Datos de ejemplo</span>
        <button class="btn btn-line sm sp" id="refresh">Actualizar</button>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="card chart"><span class="mono">Visitas por día</span><h3 style="margin-top:.3rem">Cómo llega la gente</h3><div id="chart"></div>
        <div class="leg"><span class="mono"><i></i>Visitas</span><span class="mono"><i class="w"></i>Contactos</span></div></div>
      <div class="grid3">
        <div class="card"><h3>Recorrido</h3><div id="funnel"></div></div>
        <div class="card"><h3>Dispositivos</h3><div id="devs"></div></div>
        <div class="card"><h3>Origen</h3><div id="refs"></div></div>
      </div>
      <div class="grid3">
        <div class="card"><h3>Demos más vistas</h3><div id="demos"></div></div>
        <div class="card"><h3>Interacciones</h3><div id="inter"></div></div>
        <div class="card"><h3>Zona horaria</h3><div id="zones"></div></div>
      </div>
      <div class="card" style="margin-top:.9rem"><h3>Visitas recientes</h3><div id="recent"></div></div>
    </section>

    <!-- CONTACTOS -->
    <section id="tab-crm" hidden>
      <div class="bar">
        <input id="q" type="search" placeholder="Buscar nombre, contacto o mensaje" style="flex:1;min-width:200px;padding:.7rem .9rem;background:#000;border:2px solid var(--line);color:var(--fg);font:inherit;border-radius:0;color-scheme:dark">
        <button class="btn btn-line sm" id="csv">Exportar CSV</button>
      </div>
      <div class="bar" id="stFilters"></div>
      <div class="leads" id="leads"></div>
    </section>
  </div>
</div>

<script type="module">
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=window.NS_CONFIG||{};
const OWNERS=(C.owners||[]).map(e=>String(e).toLowerCase());
const SBC=(C.supabase&&C.supabase.url&&C.supabase.anonKey)?C.supabase:null;
const STATUS=['Nuevo','Contactado','Cotizado','Cerrado','Descartado'];
const S={range:30,visits:[],events:[],leads:[],filter:'Todos',q:'',demo:false,open:new Set()};
let sb=null;   // cliente de Supabase cuando está configurado

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- pantalla de acceso ---------- */
function gate(html){$('#app').hidden=true;$('#gate').hidden=false;$('#gateCard').innerHTML='<span class="tile" style="margin-bottom:.4rem"><svg><use href="#tower"/></svg></span>'+html}
function gateSetup(){
  gate(`<span class="mono" style="display:block;margin-top:.6rem">Configuración pendiente</span>
  <h1>Falta conectar Supabase</h1>
  <p>El panel guarda y lee los datos en Supabase. Haz esto una sola vez:</p>
  <ol>
    <li>Crea un proyecto en <b>supabase.com</b>.</li>
    <li>En <b>SQL Editor</b> pega y ejecuta el archivo <code>supabase.sql</code>.</li>
    <li>En <b>Authentication, Providers</b> activa <b>Google</b> y deja Email desactivado.</li>
    <li>En <b>Authentication, URL Configuration</b> agrega la dirección de esta página (<code>/owner/</code>) en Redirect URLs.</li>
    <li>En <b>Project Settings, API</b> copia la Project URL y la clave anon en <code>ns-config.js</code>.</li>
  </ol>
  <div class="gate-act"><button class="btn btn-gold" id="goDemo">Ver con datos de ejemplo</button></div>`);
  $('#goDemo').onclick=()=>{S.demo=true;seedDemo();start('modo demostración')};
}
function gateLogin(msg){
  gate(`<span class="mono" style="display:block;margin-top:.6rem">Acceso privado</span>
  <h1>Panel de NetStature</h1>
  <p>Solo pueden entrar las cuentas autorizadas.</p>
  <div class="gate-act"><button class="btn btn-gold" id="login">Entrar con Google</button></div>
  <div class="msg-err" id="gmsg">${esc(msg||'')}</div>`);
  $('#login').onclick=async()=>{
    const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
    if(error)$('#gmsg').textContent='No se pudo iniciar sesión. Intenta de nuevo.';
  };
}

/* ---------- datos de ejemplo (solo modo demostración) ---------- */
function seedDemo(){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const now=Date.now(),devs=['mobile','mobile','mobile','desktop','tablet'],refs=['directo','instagram.com','l.instagram.com','google.com','tiktok.com','facebook.com'],zones=['America/La_Paz','America/Lima','America/Bogota','America/Mexico_City','Europe/Madrid'];
  const secs=['trabajos','servicios','proceso','faq','contacto'],demos=['Vanta Blade','Novera'];
  for(let i=0;i<420;i++){
    const ts=now-Math.floor(rnd()*rnd()*90*864e5)-Math.floor(rnd()*3e6),sid='s'+i,vid='v'+Math.floor(i*.8);
    S.visits.push({vid,sid,ts,ref:refs[Math.floor(rnd()*refs.length)],dev:devs[Math.floor(rnd()*devs.length)],tz:zones[Math.floor(rnd()*zones.length)]});
    secs.forEach((s,k)=>{if(rnd()>.28+k*.14)S.events.push({sid,ts:ts+1000*k,type:'sec',label:s})});
    if(rnd()>.7)S.events.push({sid,ts:ts+9e3,type:'demo_preview',label:demos[Math.floor(rnd()*2)]});
    if(rnd()>.85)S.events.push({sid,ts:ts+1e4,type:'wa_click',label:'contacto'});
    if(rnd()>.9)S.events.push({sid,ts:ts+1e4,type:'social',label:['Instagram','TikTok','Facebook'][Math.floor(rnd()*3)]});
    if(rnd()>.8)S.events.push({sid,ts:ts+2e3,type:'cta',label:'cotizar'});
    if(rnd()>.93)S.events.push({sid,ts:ts+3e4,type:'form',label:'inicio'});
  }
  const names=[['Camila R.','camila@correo.com','Inmobiliaria','Quiero una página para mostrar mis propiedades y recibir consultas.','Nuevo'],['Diego M.','+591 70000000','Barbería','Necesito reservas online para mi barbería.','Contactado'],['Lucía F.','lucia@tienda.com','Tienda de ropa','Catálogo por colecciones y compra por mensaje.','Cotizado'],['Marco P.','marco@clinica.com','Clínica dental','Una web con solicitud de cita.','Nuevo']];
  S.leads=names.map((n,i)=>({id:'d'+i,name:n[0],contact:n[1],type:n[2],msg:n[3],status:n[4],notes:'',ts:now-i*17*36e5-2e6}));
  S.events.push(...S.leads.map((l,i)=>({sid:'s'+i,ts:l.ts,type:'form',label:'enviado'})));
}

/* ---------- carga ---------- */
async function fetchAll(table,cols,from){            // Supabase entrega 1000 filas por petición: se pide por páginas
  const out=[];
  for(let i=0;i<25;i++){
    const {data,error}=await sb.from(table).select(cols).gte('ts',from).order('ts',{ascending:false}).range(i*1000,i*1000+999);
    if(error)throw error;
    out.push(...data);if(data.length<1000)break;
  }
  return out.map(x=>({...x,ts:Number(x.ts)}));
}
async function loadStats(){
  if(S.demo){render();return}
  const from=Date.now()-S.range*864e5;
  try{[S.visits,S.events]=await Promise.all([fetchAll('visits','vid,sid,ts,ref,dev,tz',from),fetchAll('events','sid,ts,type,label',from)]);render()}
  catch(e){toast('No se pudieron leer las estadísticas (revisa supabase.sql y el acceso)')}
}
async function loadLeads(first){
  const {data,error}=await sb.from('leads').select('*').order('ts',{ascending:false}).limit(1000);
  if(error){toast('No se pudieron leer los contactos');return}
  const before=S.leads.length;
  S.leads=data.map(l=>({...l,ts:Number(l.ts)}));
  if(!first&&S.leads.length>before)toast('Nuevo contacto recibido');
  renderLeads();renderKPIs();
}
function watchLeads(){
  if(S.demo)return;
  loadLeads(true);
  sb.channel('leads-live').on('postgres_changes',{event:'*',schema:'public',table:'leads'},()=>loadLeads()).subscribe();
  setInterval(()=>loadLeads(),30000);     // respaldo si el tiempo real no está activo
}

/* ---------- cálculos ---------- */
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const inRange=ts=>ts>=Date.now()-S.range*864e5;
function count(arr,f){const m={};arr.forEach(x=>{const k=f(x)||'—';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function hbars(el,rows,fmt){
  if(!rows.length){el.innerHTML='<div class="empty">Sin datos todavía.</div>';return}
  const max=rows[0][1];
  el.innerHTML=rows.slice(0,6).map(([k,v])=>`<div class="hb"><span>${esc(fmt?fmt(k):k)}</span><span>${v}</span><div class="tr"><i style="width:${Math.max(3,v/max*100)}%"></i></div></div>`).join('');
}
const DEVN={mobile:'Teléfono',tablet:'Tablet',desktop:'Computador'};
const SECN={trabajos:'Demostraciones',servicios:'Servicios',proceso:'Proceso',faq:'Preguntas',contacto:'Contacto'};

function render(){renderKPIs();renderChart();renderBreakdowns();renderLeads()}
function renderKPIs(){
  const V=S.visits.filter(v=>inRange(v.ts)),E=S.events.filter(e=>inRange(e.ts)),L=S.leads.filter(l=>inRange(l.ts));
  const uniq=new Set(V.map(v=>v.vid)).size,wa=E.filter(e=>e.type==='wa_click').length;
  const conv=uniq?(L.length/uniq*100):0;
  const today=V.filter(v=>dayKey(v.ts)===dayKey(Date.now())).length;
  const k=[['Visitas',V.length,'sin contar tus propias visitas'],['Visitantes únicos',uniq,'personas distintas'],['Contactos',L.length,'solicitudes por el formulario'],['Conversión',conv.toFixed(1)+'%','contactos / visitantes únicos'],['Clics a WhatsApp',wa,'hoy: '+today+' visitas']];
  $('#kpis').innerHTML=k.map(([l,v,s])=>`<div class="kpi"><span class="mono">${l}</span><b>${v}</b><small>${s}</small></div>`).join('');
  $('#newBadge').textContent=S.leads.filter(l=>l.status==='Nuevo').length;
}
function renderChart(){
  const days=S.range,now=new Date();now.setHours(0,0,0,0);
  const keys=[],vis={},led={};
  for(let i=days-1;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const k=dayKey(d);keys.push(k);vis[k]=0;led[k]=0}
  S.visits.forEach(v=>{const k=dayKey(v.ts);if(k in vis)vis[k]++});
  S.leads.forEach(l=>{const k=dayKey(l.ts);if(k in led)led[k]++});
  const max=Math.max(4,...keys.map(k=>vis[k])),W=700,H=190,pl=26,pb=22,bw=(W-pl)/keys.length;
  let g='';
  [0,.5,1].forEach(f=>{const y=H-pb-(H-pb-6)*f;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(236,233,226,.1)"/><text class="ax" x="0" y="${y+3}">${Math.round(max*f)}</text>`});
  keys.forEach((k,i)=>{
    const h=(H-pb-6)*vis[k]/max,x=pl+i*bw,y=H-pb-h;
    g+=`<rect class="b" x="${x+bw*.12}" y="${y}" width="${Math.max(1,bw*.76)}" height="${Math.max(0,h)}"><title>${k}: ${vis[k]} visitas, ${led[k]} contactos</title></rect>`;
    if(led[k])g+=`<rect class="l" x="${x+bw*.12}" y="${H-pb+3}" width="${Math.max(2,bw*.76)}" height="5"/>`;
  });
  const step=Math.ceil(keys.length/6);
  keys.forEach((k,i)=>{if(i%step===0)g+=`<text class="ax" x="${pl+i*bw}" y="${H-4}">${k.slice(5).replace('-','/')}</text>`});
  $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas por día">${g}</svg>`;
}
function renderBreakdowns(){
  const V=S.visits.filter(v=>inRange(v.ts)),E=S.events.filter(e=>inRange(e.ts));
  const sessions=new Set(V.map(v=>v.sid)).size||1;
  // recorrido
  const reach=s=>new Set(E.filter(e=>e.type==='sec'&&e.label===s).map(e=>e.sid)).size;
  const formStart=new Set(E.filter(e=>e.type==='form'&&e.label==='inicio').map(e=>e.sid)).size;
  const sent=S.leads.filter(l=>inRange(l.ts)).length;
  const fr=[...Object.keys(SECN).map(s=>[SECN[s],reach(s)]),['Empezaron el formulario',formStart],['Enviaron solicitud',sent]];
  $('#funnel').innerHTML=fr.map(([k,v])=>`<div class="hb"><span>${esc(k)}</span><span>${Math.round(Math.min(v,sessions)/sessions*100)}%</span><div class="tr"><i style="width:${Math.max(2,Math.min(v,sessions)/sessions*100)}%"></i></div></div>`).join('')+`<div class="mono" style="margin-top:.6rem">% de visitas que llegaron a cada punto</div>`;
  hbars($('#devs'),count(V,v=>v.dev),k=>DEVN[k]||k);
  hbars($('#refs'),count(V,v=>v.ref));
  hbars($('#demos'),count(E.filter(e=>e.type==='demo_preview'),e=>e.label),k=>k);
  hbars($('#zones'),count(V,v=>v.tz),k=>k.replace(/_/g,' '));
  const wa=E.filter(e=>e.type==='wa_click').length,cta=E.filter(e=>e.type==='cta'&&/^cotizar/.test(e.label)).length,op=E.filter(e=>e.type==='demo_open').length,pv=E.filter(e=>e.type==='demo_preview').length;
  const soc=count(E.filter(e=>e.type==='social'),e=>e.label).map(([k,v])=>[k,v]);
  hbars($('#inter'),[['Botones "Cotizar"',cta],['Clics a WhatsApp',wa],['Vistas previas de demos',pv],['Demos abiertas',op],...soc.map(([k,v])=>['Red: '+k,v])].filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]));
  const rec=V.slice().sort((a,b)=>b.ts-a.ts).slice(0,8);
  $('#recent').innerHTML=rec.length?`<table class="recent">${rec.map(v=>`<tr><td>${new Date(v.ts).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(DEVN[v.dev]||v.dev)}</td><td>${esc(v.ref)}</td><td>${esc((v.tz||'').replace(/_/g,' '))}</td></tr>`).join('')}</table>`:'<div class="empty">Aún no hay visitas registradas.</div>';
}

/* ---------- contactos (CRM) ---------- */
const ago=ts=>{const m=Math.round((Date.now()-ts)/6e4);if(m<1)return 'ahora';if(m<60)return 'hace '+m+' min';const h=Math.round(m/60);if(h<24)return 'hace '+h+' h';const d=Math.round(h/24);return 'hace '+d+' d'};
function contactLinks(c){
  c=String(c||'');
  if(/@/.test(c))return `<a class="btn btn-line sm" href="mailto:${esc(c)}">Escribir correo</a>`;
  let d=c.replace(/\D/g,'');if(!d)return '';
  const cc=String(C.defaultCountry||'');if(cc&&d.length<=8)d=cc+d;
  return `<a class="btn btn-gold sm" href="https://wa.me/${d}" target="_blank" rel="noopener">Abrir WhatsApp</a>`;
}
function renderLeads(){
  const f=$('#stFilters');
  const cnt=s=>s==='Todos'?S.leads.length:S.leads.filter(l=>l.status===s).length;
  f.innerHTML=['Todos',...STATUS].map(s=>`<button class="chip ${S.filter===s?'on':''}" data-f="${s}">${s} ${cnt(s)}</button>`).join('');
  const q=S.q.toLowerCase();
  const L=S.leads.filter(l=>(S.filter==='Todos'||l.status===S.filter)&&(!q||[l.name,l.contact,l.msg,l.type].join(' ').toLowerCase().includes(q)));
  $('#leads').innerHTML=L.length?L.map(l=>`
    <article class="lead ${S.open.has(l.id)?'open':''}" data-id="${esc(l.id)}">
      <button type="button" data-t><span class="pill st-${esc(l.status)}">${esc(l.status)}</span>
        <span class="mid"><h4>${esc(l.name)}</h4><span class="sub">${esc(l.type)} · ${esc(l.contact)}</span></span>
        <span class="when">${ago(l.ts)}</span></button>
      <div class="body">
        <div class="row">${contactLinks(l.contact)}<span class="mono" style="align-self:center">${new Date(l.ts).toLocaleString('es',{dateStyle:'medium',timeStyle:'short'})}</span></div>
        <div class="msg">${esc(l.msg)}</div>
        <div class="ctl">
          <div><label class="mono" style="display:block;margin-bottom:.4rem">Estado</label><select data-st>${STATUS.map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('')}</select></div>
          <div><label class="mono" style="display:block;margin-bottom:.4rem">Notas internas</label><textarea data-nt placeholder="Ej. cotización enviada, llamar el lunes">${esc(l.notes||'')}</textarea></div>
        </div>
        <div class="acts"><button class="btn btn-gold sm" data-save>Guardar</button><button class="btn btn-line sm" data-del>Eliminar</button></div>
      </div>
    </article>`).join(''):`<div class="empty card">${S.leads.length?'Ningún contacto coincide con el filtro.':'Cuando alguien llene el formulario, aparecerá aquí al instante.'}</div>`;
}
document.addEventListener('click',async e=>{
  const ch=e.target.closest('[data-f]');if(ch){S.filter=ch.dataset.f;renderLeads();return}
  const rg=e.target.closest('[data-r]');if(rg){S.range=+rg.dataset.r;$$('[data-r]').forEach(b=>b.classList.toggle('on',b===rg));loadStats();return}
  const tab=e.target.closest('[data-tab]');if(tab){$$('[data-tab]').forEach(b=>b.classList.toggle('on',b===tab));$('#tab-res').hidden=tab.dataset.tab!=='res';$('#tab-crm').hidden=tab.dataset.tab!=='crm';return}
  const card=e.target.closest('.lead');if(!card)return;
  const id=card.dataset.id;
  if(e.target.closest('[data-t]')){card.classList.toggle('open');card.classList.contains('open')?S.open.add(id):S.open.delete(id);return}
  if(e.target.closest('[data-save]')){
    const st=$('[data-st]',card).value,nt=$('[data-nt]',card).value.slice(0,1500),l=S.leads.find(x=>x.id===id);
    try{
      if(!S.demo){const {data,error}=await sb.from('leads').update({status:st,notes:nt}).eq('id',id).select('id');if(error||!data.length)throw error||new Error('sin permiso')}
      l.status=st;l.notes=nt;toast('Guardado');renderLeads();renderKPIs();
    }catch(err){toast('No se pudo guardar')}
    return;
  }
  if(e.target.closest('[data-del]')){
    if(!confirm('¿Eliminar este contacto? No se puede deshacer.'))return;
    try{if(!S.demo){const {data,error}=await sb.from('leads').delete().eq('id',id).select('id');if(error||!data.length)throw error||new Error('sin permiso')}S.leads=S.leads.filter(x=>x.id!==id);toast('Eliminado');renderLeads();renderKPIs()}catch(err){toast('No se pudo eliminar')}
  }
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderLeads()});
$('#refresh').onclick=()=>{loadStats();toast('Actualizado')};
$('#csv').onclick=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Fecha','Nombre','Contacto','Tipo','Mensaje','Estado','Notas'],...S.leads.map(l=>[new Date(l.ts).toISOString(),l.name,l.contact,l.type,l.msg,l.status,l.notes||''])];
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='contactos-netstature.csv';a.click();
};

/* ---------- arranque ---------- */
function start(who){
  $('#gate').hidden=true;$('#app').hidden=false;
  $('#who').textContent=who;$('#sampleTag').hidden=!S.demo;
  render();
  if(!S.demo){loadStats();watchLeads();setInterval(loadStats,120000)}
}
$('#out').onclick=async()=>{if(S.demo){location.reload();return}try{localStorage.removeItem('ns-owner')}catch(e){}await sb.auth.signOut()};

(async()=>{
  if(!SBC){gateSetup();return}
  try{
    const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
    sb=createClient(SBC.url,SBC.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    let denied='',started=false;
    const handle=async session=>{
      if(!session){started=false;gateLogin(denied);return}
      const email=(session.user.email||'').toLowerCase();
      if(!OWNERS.includes(email)){denied=`La cuenta ${email} no está autorizada.`;await sb.auth.signOut();gateLogin(denied);return}
      denied='';try{localStorage.setItem('ns-owner','1')}catch(e){}
      if(!started){started=true;start(email)}
    };
    sb.auth.onAuthStateChange((_ev,session)=>{setTimeout(()=>handle(session),0)});
    const {data}=await sb.auth.getSession();
    handle(data.session);
  }catch(e){gate(`<h1>No se pudo cargar</h1><p>Revisa tu conexión y los datos de <code>ns-config.js</code>.</p>`)}
})();
